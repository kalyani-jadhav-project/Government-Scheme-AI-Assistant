spring.application.name=govassist-backend

# Database (H2 in-memory for practice/demo)
spring.datasource.url=jdbc:h2:mem:govassist_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# JWT
jwt.secret=${JWT_SECRET:govassist-secret-key-for-jwt-token-signing-must-be-256-bits-long-for-security}
jwt.expiration=86400000

# Server (Render injects PORT automatically, default 8081 for local run)
server.port=${PORT:8081}

# CORS (set FRONTEND_URL on Render to your Static Site URL)
spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# AI API (Gemini)
ai.gemini.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
ai.gemini.model=gemini-pro

# Logging
logging.level.com.govassist=INFO
